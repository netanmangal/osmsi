[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osmsi-harness"
version = "0.1.0"
description = "Budgeted model evaluations for the Open Source Model Safety Index."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["osmsi-sdk>=0.1.0,<0.2"]

[project.scripts]
osmsi-evaluate = "osmsi_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osmsi_harness = ["builtin/*.json"]

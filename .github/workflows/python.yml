name: Python SDK and artifact pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["sdk/python/**", "harness/**", "pipelines/**", "suites/**", "data/**", "web/public/results/**", "web/public/evidence/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["sdk/python/**", "harness/**", "pipelines/**", "suites/**", "data/**", "web/public/results/**", "web/public/evidence/**", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      # Build the wheel from the sdist, then test the installed package.
      - run: python -m build sdk/python --outdir out/packages
      - run: python -m build harness --outdir out/packages
      - run: python -m pip install out/packages/*.whl
      - run: python -m unittest discover -s sdk/python/tests
      - run: python -m unittest discover -s harness/tests
      - run: python -m unittest discover -s pipelines -p 'test_*.py'
      - run: >-
          python pipelines/stage_results.py sdk/python/tests/fixtures/sample-run
          --destination out/ci-sample-bundle --allow-samples
      - run: osmsi run --provider demo --output runs/ci-demo --limit 2
      - run: osmsi validate runs/ci-demo/bundle --allow-samples
      - run: python pipelines/verify_publication.py

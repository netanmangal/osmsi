name: Discover model candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipelines/discover_models.py --limit 20 --output out/candidates.json
      - uses: actions/upload-artifact@v4
        with:
          name: model-candidates-for-review
          path: out/candidates.json
          retention-days: 14

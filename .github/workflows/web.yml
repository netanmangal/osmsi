name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "package.json", ".nvmrc", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "package.json", ".nvmrc", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm run setup

      # tsc -b && vite build — typecheck failures fail the build on purpose
      - run: npm run build
